const fmtD=s=>{if(!s)return'';if(db.set.cal==='g')return fa(s.replace(/-/g,'/'));const[y,m,d]=J(s);return fa(y+'/'+pad(m)+'/'+pad(d))};

const act=id=>db.acts.find(a=>a.id===id),aN=id=>act(id)?.name||'(فعالیت حذف‌شده)',aC=id=>CATS[act(id)?.cat]?.[1]||'#94a3b8';

function overlapsOf(d){const l=E(d).slice().sort((a,b)=>tm(a.start)-tm(b.start)),o=[];for(let i=0;i<l.length;i++)for(let j=i+1;j<l.length;j++){const a=l[i],b=l[j],s=Math.max(tm(a.start),tm(b.start)),e=Math.min(tm(a.start)+a.min,tm(b.start)+b.min);if(e>s)o.push({a,b,m:e-s})}return o}
const allOv=()=>{const r=[];dataDays().forEach(d=>overlapsOf(d).forEach(x=>r.push({d,...x})));return r};
const confOf=an=>an.n>=7?'بالا':an.n>=3?'متوسط':'کم';
